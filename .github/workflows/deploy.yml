name: Build & Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/nextera-matt/matthodges-contact

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push contact-api image
        uses: docker/build-push-action@v6
        with:
          context: services/contact-api
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync static site files
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='services' --exclude='README.md' --exclude='caelric'
          path: ./
          remote_path: /var/www/matthodges.uk/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: 2233
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Sync docker-compose file for contact-api
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: services/contact-api/docker-compose.yml
          remote_path: /home/rocky/contact-api/docker-compose.yml
          remote_host: ${{ secrets.VPS_HOST }}
          remote_port: 2233
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pull and restart contact-api container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: 2233
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/rocky/contact-api
            docker compose pull
            docker compose up -d
