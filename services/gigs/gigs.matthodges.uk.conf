# Own site for the gig archive. Do not paste this into the matthodges.uk server.
# Install as /etc/nginx/conf.d/gigs.matthodges.uk.conf
#
# One-time, on the VPS:
#   sudo mkdir -p /var/www/gigs.matthodges.uk
#   sudo chown rocky:rocky /var/www/gigs.matthodges.uk
#   sudo dnf install -y httpd-tools
#   sudo htpasswd -c /etc/nginx/gigs.htpasswd matt
#   sudo chown root:nginx /etc/nginx/gigs.htpasswd
#   sudo chmod 640 /etc/nginx/gigs.htpasswd
#
# DNS: an A record for gigs.matthodges.uk pointing at this VPS, then a
# certificate. If nginx -t fails because the cert files are missing, comment
# out the 443 server, reload, run certbot, then restore it:
#   sudo certbot certonly --webroot -w /var/www/gigs.matthodges.uk -d gigs.matthodges.uk
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name gigs.matthodges.uk;
    root /var/www/gigs.matthodges.uk;

    location /.well-known/acme-challenge/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gigs.matthodges.uk;
    root /var/www/gigs.matthodges.uk;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/gigs.matthodges.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gigs.matthodges.uk/privkey.pem;

    auth_basic "Gig archive";
    auth_basic_user_file /etc/nginx/gigs.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /catalog.json {
        alias /var/media/gigs/catalog.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        limit_except GET HEAD { deny all; }
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 64k;
        limit_except POST { deny all; }
    }

    location /media/ {
        alias /var/media/gigs/videos/;
        autoindex off;
        sendfile on;
        add_header Cache-Control "private" always;
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        limit_except GET HEAD { deny all; }
        types {
            video/mp4 mp4 m4v;
            video/webm webm;
            video/ogg ogg ogv;
            video/quicktime mov;
            video/x-matroska mkv;
        }
    }
}
