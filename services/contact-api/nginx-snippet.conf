# Add this inside the existing `server { listen 443 ssl; ... }` block
# in /etc/nginx/conf.d/matthodges.uk.conf, then: nginx -t && systemctl reload nginx

location /api/contact {
    proxy_pass http://127.0.0.1:8091/api/contact;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/tools/ {
    proxy_pass http://127.0.0.1:8091/api/tools/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Trailing slash on both the location and proxy_pass here strips the
# /tools/support-dashboard/ prefix before forwarding, so the PHP app
# sees plain root-relative requests (e.g. /?role=admin) same as if it
# were running standalone.
location /tools/support-dashboard/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
